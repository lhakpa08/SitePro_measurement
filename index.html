<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <meta name="description" content="Professional site measurement and audit tool for road and chain-link fence construction with GPS and incremental logging." />
    <meta property="og:title" content="SitePro - Road &amp; Chain-Link Fence Site Measurement" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <script>
      (function () {
        try {
          var saved = localStorage.getItem('sitepro_theme');
          if (saved === 'dark') {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="antialiased bg-slate-100 dark:bg-slate-950 text-slate-950 dark:text-slate-50">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
